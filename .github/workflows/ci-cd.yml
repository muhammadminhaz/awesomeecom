name: AwesomeEcom CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - api-gateway
          - eureka-server
          - customer-service
          - product-service
          - cart-service
          - order-service
          - payment-service
          - notification-service

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build and Test ${{ matrix.service }}
      working-directory: ./${{ matrix.service }}
      run: mvn clean package
      
