input {
  tcp { port => 4000 codec => json }  # customer-service
  tcp { port => 4001 codec => json }  # product-service
  tcp { port => 4002 codec => json }  # cart-service
  tcp { port => 4003 codec => json }  # order-service
  tcp { port => 4004 codec => json }  # payment-service
  tcp { port => 4005 codec => json }  # notification-service
  tcp { port => 4006 codec => json }  # api-gateway
  tcp { port => 8761 codec => json }  # eureka-server
}

filter {
  # Example filter: parse Spring Boot style JSON logs if needed
  # If logs are already structured JSON, this may be optional
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{service}-%{+YYYY.MM.dd}"
  }

  stdout { codec => rubydebug }
}
