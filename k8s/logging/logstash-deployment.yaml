apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: awesomeecom
data:
  logstash.conf: |
    input {
      tcp {
        port => 5044
        codec => json
      }
    }
    filter {
        # Example filter: parse Spring Boot style JSON logs if needed
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "%{service}-%{+YYYY.MM.dd}"
      }
      stdout { codec => rubydebug }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: awesomeecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:9.1.9
          ports:
            - containerPort: 5044
            - containerPort: 9600
          env:
            - name: xpack.monitoring.enabled
              value: "false"
            - name: LS_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
            - name: logstash-data
              mountPath: /usr/share/logstash/data
          resources:
            requests:
              cpu: "150m"
              memory: "512Mi"
            limits:
              cpu: "300m"
              memory: "768Mi"

      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline
        - name: logstash-data
          persistentVolumeClaim:
            claimName: logstash-data
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: awesomeecom
spec:
  selector:
    app: logstash
  ports:
    - name: tcp
      port: 5044
      targetPort: 5044
    - name: http
      port: 9600
      targetPort: 9600
  type: ClusterIP

