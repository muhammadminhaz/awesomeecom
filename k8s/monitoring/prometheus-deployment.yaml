apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: awesomeecom
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'awesomeecom-services'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets:
              - api-gateway:4006
              - customer-service:4000
              - product-service:4001
              - cart-service:4002
              - order-service:4003
              - payment-service:4004
              - notification-service:4005
              - eureka-server:8761
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: awesomeecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus/
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "384Mi"
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: awesomeecom
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30090
