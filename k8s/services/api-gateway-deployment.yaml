apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: awesomeecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "200m"
          memory: "384Mi"
      containers:
        - name: api-gateway
          image: api-gateway:1.0
          ports:
            - containerPort: 4006
          env:
            - name: SPRING_REDIS_HOST
              value: "redis"
            - name: SPRING_REDIS_PORT
              value: "6379"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 4006
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: awesomeecom
spec:
  selector:
    app: api-gateway
  ports:
    - port: 4006
      targetPort: 4006
      nodePort: 30006
  type: NodePort
