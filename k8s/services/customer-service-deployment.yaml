
# Customer Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: awesomeecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: customer-service:1.0
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: customer-service-config
            - secretRef:
                name: customer-service-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "384Mi"
---
# Customer Service
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: awesomeecom
spec:
  selector:
    app: customer-service
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
